# _quarto-html.yml
project:
  output-dir: _outputs/html
  resources:
    - resources/images/ants.png

website:
  announcement:
    dismissable: false
    content: "![](resources/images/ants.png){.iasi-ants-image}"
    type: light
    position: above-navbar

format:
  html:
    include-in-header: resources/js/iasi.html
    theme:
      - cosmo
      - resources/css/iasi.scss
    toc: true
    number-sections: true

book:
  navbar:
    title: "User Guide"
    left:
      - text: "Introducción"
        href: chapters/01-intro/index.qmd
      - text: "Fundamentos"
        href: chapters/02-fundamentals/index.qmd
      - text: "Instalación"
        href: chapters/03-installation/index.qmd
      - text: "Workflow"
        href: chapters/04-workflow/index.qmd
      - text: "API"
        href: chapters/05-api/index.qmd
    right:
      - icon: file-pdf
        href: IASI-Quarto-User-Guide.pdf
        aria-label: "Descargar guía en PDF"
      - icon: translate
        href: https://iasi-org.github.io/iasi-home/pages/common/manifesto-bilingual.html
        aria-label: "Idioma / Language"
      - icon: envelope
        href: https://iasi-org.github.io/iasi-home/pages/common/contact.html
        aria-label: "Contacto"
