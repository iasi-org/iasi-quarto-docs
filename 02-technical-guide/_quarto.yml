project:
  type: book

metadata-files:
  - _book-structure.yml

book:
  title: "IASI Quarto Technical Guide"
  subtitle: "Framework for Engineering Documentation with Quarto"
  author: "IASI Project"

format:
  html:
    toc: true
    number-sections: true

  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true

execute:
  freeze: auto
  
filters:
  - ../../iasi-standards/resources/quarto/extensions/plantuml/plantuml.lua
  
filter-options:
  plantuml:
    enabled: true
    server: http://javier:1025
    format: png
    cache: true
